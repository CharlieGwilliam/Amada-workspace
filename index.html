<script>
    // --- NOTIFICATIONS ---
    const ONESIGNAL_APP_ID = "40ee1473-8e3b-4e29-b08e-e424b0e35e39";
    const JSONBIN_KEY = "$2a$10$2Gc.koP13tnHaC6EZsfQXODqaMeOGptcDQKEh3JNf4Aeja1Vfc0uS";
    const JSONBIN_BIN_ID = "6ae0b445ffd5d160538fff26";

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      if (ONESIGNAL_APP_ID && !ONESIGNAL_APP_ID.includes("PASTE_")) { await OneSignal.init({ appId: ONESIGNAL_APP_ID, notifyButton: { enable: false } }); updatePushUI(); }
    });

    function getNotificationPrefs(username) { const saved = localStorage.getItem(`amada_notify_${username}`); if (!saved) return { enabled: false, notifyAssigned: false, notifyCompleted: false, notifyOrders: false, notifyNotes: false }; return JSON.parse(saved); }
    function saveNotificationPref(key, value) { if (!activeUser) return; const prefs = getNotificationPrefs(activeUser); prefs[key] = value; localStorage.setItem(`amada_notify_${activeUser}`, JSON.stringify(prefs)); }

    async function requestNotificationPermission() {
      if (typeof window.Notification !== 'undefined') {
        try {
          const permission = await window.Notification.requestPermission();
          if (permission === 'granted') {
            if (window.OneSignalDeferred) OneSignalDeferred.push(function(OneSignal) { OneSignal.User.PushSubscription.optIn(); });
            const prefs = getNotificationPrefs(activeUser); prefs.enabled = true; prefs.notifyAssigned = true; prefs.notifyCompleted = true; prefs.notifyOrders = true; prefs.notifyNotes = true;
            localStorage.setItem(`amada_notify_${activeUser}`, JSON.stringify(prefs)); updatePushUI();
          } else { alert("Notifications denied. Check iOS Settings > Safari (or Amada App) and allow Notifications."); }
        } catch (e) { alert("Could not request permissions. Make sure your iPhone is updated to iOS 16.4+."); }
      } else { alert("Web Push is not supported here. Make sure you added this to your Home Screen on iOS 16.4+."); }
    }

    function updatePushUI() {
      if (!activeUser) return; const prefs = getNotificationPrefs(activeUser); const badge = document.getElementById("pushStatusBadge"); const btn = document.getElementById("enablePushBtn");
      ['prefNotifyAssigned', 'prefNotifyCompleted', 'prefNotifyOrders', 'prefNotifyNotes'].forEach(id => { const el = document.getElementById(id); if (el) el.checked = !!prefs[id.replace('prefN', 'n')]; });
      if (prefs.enabled) { if (badge) { badge.innerText = "ACTIVE"; badge.className = "text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-400"; } if (btn) { btn.innerText = "Push Notifications Active"; btn.disabled = true; btn.className = "w-full py-2 px-3 rounded-xl bg-gray-700 text-gray-400 text-xs font-bold cursor-default mb-3"; } } 
      else { if (badge) { badge.innerText = "OFF"; badge.className = "text-[10px] px-2 py-0.5 rounded-full font-bold bg-gray-200 dark:bg-gray-800 text-gray-400"; } if (btn) { btn.innerText = "Enable Device Push Notifications"; btn.disabled = false; btn.className = "w-full py-2 px-3 rounded-xl bg-[#A6192E] text-white text-xs font-bold shadow hover:opacity-90 transition mb-3"; } }
    }

    function triggerLocalNotification(title, message) {
      if (typeof window.Notification !== 'undefined' && Notification.permission === "granted") {
        if (navigator.serviceWorker) { navigator.serviceWorker.ready.then(reg => { reg.showNotification(title, { body: message, icon: "icon.png" }); }).catch(() => { new Notification(title, { body: message, icon: "icon.png" }); }); } 
        else { new Notification(title, { body: message, icon: "icon.png" }); }
      }
    }

    // --- CORE LOGIC ---
    const BASELINE_USERS = [{ name: "Charlie", role: "master_admin", password: "AMADA" }, { name: "Jacob", role: "admin", password: "AMADA" }];
    function ensureProfiles(userList) {
      if (!Array.isArray(userList) || userList.length === 0) return JSON.parse(JSON.stringify(BASELINE_USERS));
      if (!userList.find(u => u && u.name === "Charlie")) userList.unshift({ name: "Charlie", role: "master_admin", password: "AMADA" });
      if (!userList.find(u => u && u.name === "Jacob")) userList.push({ name: "Jacob", role: "admin", password: "AMADA" });
      return userList;
    }

    let users = ensureProfiles(JSON.parse(localStorage.getItem("amada_users")));
    let activeUser = localStorage.getItem("amada_active_user") || "";
    let currentWorkspace = 'shared', currentMainTab = "tasks", currentNoteFolderId = null, activeFilterType = null, activeFilterId = null, selectedUserForAuth = "", presenceMap = {}, isCompletedOpen = false, isCompletedOrdersOpen = false, openAccordionsMap = {};
    let sharedTags = JSON.parse(localStorage.getItem("amada_shared_tags")) || [{ id: "t_urgent", title: "Urgent", color: "#ef4444" }, { id: "t_cnc", title: "Machining", color: "#3b82f6" }];
    let sharedSections = JSON.parse(localStorage.getItem("amada_shared_sections")) || [{ id: "s1", title: "High Priority" }, { id: "s2", title: "Medium Priority" }];
    let noteFolders = JSON.parse(localStorage.getItem("amada_note_folders")) || [{ id: "nf1", title: "General Guidelines", parentId: null }];
    let tasks = JSON.parse(localStorage.getItem("amada_tasks")) || [];
    let notes = JSON.parse(localStorage.getItem("amada_notes")) || [];
    let orders = JSON.parse(localStorage.getItem("amada_orders")) || [];
    let globalActivity = JSON.parse(localStorage.getItem("amada_recent_activity")) || { id: "", msg: "", user: "" };
    let tempFileState = { note: null, task: null, order: null }; 

    function canModifyItem(item) { if (item.owner === activeUser) return true; if (item.restricted) return false; const u = users.find(x => x.name === activeUser); return u && (u.role === "admin" || u.role === "master_admin"); }
    function getPersonalOrderedSections() {
      if (!activeUser) return sharedSections; const savedOrder = JSON.parse(localStorage.getItem(`amada_order_${activeUser}`)); if (!Array.isArray(savedOrder) || savedOrder.length === 0) return sharedSections;
      const ordered = []; savedOrder.forEach(id => { const found = sharedSections.find(s => s.id === id); if (found) ordered.push(found); });
      sharedSections.forEach(s => { if (!ordered.some(o => o.id === s.id)) ordered.push(s); }); return ordered;
    }
    function savePersonalSectionOrder(newIdArray) { if (!activeUser) return; localStorage.setItem(`amada_order_${activeUser}`, JSON.stringify(newIdArray)); renderAll(); }
    function resetPersonalOrder() { if (!activeUser) return; localStorage.removeItem(`amada_order_${activeUser}`); renderAll(); alert("Layout reset to default!"); }

    window.onload = () => { users = ensureProfiles(users); noteFolders.forEach(f => { if(f.parentId === undefined) f.parentId = null; }); renderUserProfiles(); checkAuth(); renderAll(); fetchFromRemoteBin(); setInterval(fetchFromRemoteBin, 3500); setupCanvasEvents(); };

    function switchWorkspace(ws) {
      currentWorkspace = ws; const btnS = document.getElementById("wsBtnShared"); const btnP = document.getElementById("wsBtnPersonal");
      const activeClass = "px-2.5 md:px-4 py-1.5 rounded-lg text-[10px] md:text-xs font-bold bg-[#A6192E] text-white shadow transition-all whitespace-nowrap";
      const inactiveClass = "px-2.5 md:px-4 py-1.5 rounded-lg text-[10px] md:text-xs font-bold text-gray-500 hover:text-gray-800 dark:text-gray-400 hover:text-white transition-all whitespace-nowrap";
      if (ws === 'shared') { btnS.className = activeClass; btnP.className = inactiveClass; } else { btnP.className = activeClass; btnS.className = inactiveClass; }
      renderAll();
    }
    function toggleMobileSidebar(force) {
      const sidebar = document.getElementById("mainSidebar"); const backdrop = document.getElementById("sidebarBackdrop"); const shouldOpen = force !== undefined ? force : sidebar.classList.contains("-translate-x-full");
      if (shouldOpen) { sidebar.classList.remove("-translate-x-full"); backdrop.classList.remove("hidden"); } else { sidebar.classList.add("-translate-x-full"); backdrop.classList.add("hidden"); }
    }
    function toggleCompletedDropdown() { isCompletedOpen = !isCompletedOpen; document.getElementById("completedDropdownContainer").classList.toggle("hidden", !isCompletedOpen); document.getElementById("completedChevron").classList.toggle("rotate-90", isCompletedOpen); }
    function toggleCompletedOrdersDropdown() { isCompletedOrdersOpen = !isCompletedOrdersOpen; document.getElementById("completedOrdersContainer").classList.toggle("hidden", !isCompletedOrdersOpen); document.getElementById("completedOrdersChevron").classList.toggle("rotate-90", isCompletedOrdersOpen); }
    function updateSyncUI(status) {
      const badge = document.getElementById("githubSyncBadge"); const pulse = document.getElementById("syncPulse"); if (!badge || !pulse) return;
      if (status === "ok") { badge.innerText = "Live"; pulse.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse"; } else { badge.innerText = "Alert"; pulse.className = "w-2 h-2 rounded-full bg-red-500"; }
    }
    function updatePresenceUI() {
      const container = document.getElementById("activeUsersList"); if (!container) return; const now = Date.now(); const activeList = [];
      users.forEach(u => { const lastSeen = presenceMap[u.name] || 0; if ((now - lastSeen < 45000) || (u.name === activeUser)) activeList.push({ name: u.name, isMe: u.name === activeUser }); });
      container.innerHTML = activeList.map(item => `<div class="flex items-center justify-between py-1 border-b border-gray-100 dark:border-gray-800/50 last:border-none"><div class="flex items-center space-x-2"><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div><span class="font-bold text-gray-200">${item.name}</span></div><span class="text-[10px] text-emerald-400 font-semibold">${item.isMe ? '(You)' : 'Active'}</span></div>`).join('');
    }

    async function fetchFromRemoteBin() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { method: "GET", headers: { "X-Master-Key": JSONBIN_KEY } });
        if (res.ok) {
          const content = (await res.json()).record || {};
          if (content.recentActivity && content.recentActivity.id !== globalActivity.id) { if (content.recentActivity.user !== activeUser) triggerLocalNotification("Workspace Update", content.recentActivity.msg); globalActivity = content.recentActivity; localStorage.setItem("amada_recent_activity", JSON.stringify(globalActivity)); }
          if (content.users) users = ensureProfiles(content.users); if (content.sharedTags) sharedTags = content.sharedTags; if (content.sharedSections) sharedSections = content.sharedSections; if (content.noteFolders) noteFolders = content.noteFolders; if (content.tasks) tasks = content.tasks; if (content.notes) notes = content.notes; if (content.orders) orders = content.orders; if (content.presence) presenceMap = content.presence;
          if (activeUser) presenceMap[activeUser] = Date.now();
          localStorage.setItem("amada_users", JSON.stringify(users)); localStorage.setItem("amada_shared_tags", JSON.stringify(sharedTags)); localStorage.setItem("amada_shared_sections", JSON.stringify(sharedSections)); localStorage.setItem("amada_note_folders", JSON.stringify(noteFolders)); localStorage.setItem("amada_tasks", JSON.stringify(tasks)); localStorage.setItem("amada_notes", JSON.stringify(notes)); localStorage.setItem("amada_orders", JSON.stringify(orders));
          updateSyncUI("ok"); updatePresenceUI(); renderUserProfiles(); renderPermissionsUserList();
          const el = document.activeElement; if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA' && el.tagName !== 'SELECT')) renderAll();
        } else updateSyncUI("error");
      } catch (e) { updateSyncUI("error"); }
    }

    async function saveData(actionMessage = "") {
      if (activeUser) presenceMap[activeUser] = Date.now();
      if (actionMessage) { globalActivity = { id: Date.now().toString(), msg: actionMessage, user: activeUser }; localStorage.setItem("amada_recent_activity", JSON.stringify(globalActivity)); }
      localStorage.setItem("amada_users", JSON.stringify(users)); localStorage.setItem("amada_shared_tags", JSON.stringify(sharedTags)); localStorage.setItem("amada_shared_sections", JSON.stringify(sharedSections)); localStorage.setItem("amada_note_folders", JSON.stringify(noteFolders)); localStorage.setItem("amada_tasks", JSON.stringify(tasks)); localStorage.setItem("amada_notes", JSON.stringify(notes)); localStorage.setItem("amada_orders", JSON.stringify(orders));
      renderAll(); updatePresenceUI(); renderPermissionsUserList();
      try { await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY }, body: JSON.stringify({ users, sharedTags, sharedSections, noteFolders, tasks, notes, orders, presence: presenceMap, recentActivity: globalActivity }) }); updateSyncUI("ok"); } catch (e) { updateSyncUI("error"); }
    }

    function selectUserForLogin(name) { selectedUserForAuth = name; document.getElementById("loginUserLabel").innerText = `Password for ${name}`; document.getElementById("userSelectionStep").classList.add("hidden"); document.getElementById("passwordStep").classList.remove("hidden"); document.getElementById("loginPassword").focus(); }
    function resetLoginStep() { document.getElementById("userSelectionStep").classList.remove("hidden"); document.getElementById("passwordStep").classList.add("hidden"); }
    function verifyPassword(e) {
      e.preventDefault(); const u = users.find(x => x.name === selectedUserForAuth); const targetPassword = (u && u.password) ? u.password : "AMADA";
      if (document.getElementById("loginPassword").value === targetPassword) {
        activeUser = selectedUserForAuth; presenceMap[activeUser] = Date.now(); localStorage.setItem("amada_active_user", activeUser);
        document.getElementById("authOverlay").classList.add("hidden"); document.getElementById("loginPassword").value = "";
        switchWorkspace('shared'); checkAuth(); fetchFromRemoteBin(); 
      } else document.getElementById("authError").classList.remove("hidden");
    }
    function checkAuth() { if (activeUser && users.some(u => u.name === activeUser)) { document.getElementById("authOverlay").classList.add("hidden"); document.getElementById("userBadge").innerText = activeUser.charAt(0); document.getElementById("userBadge").title = activeUser; } else { document.getElementById("authOverlay").classList.remove("hidden"); renderUserProfiles(); } }
    function handleLogout() { if (activeUser && presenceMap[activeUser]) delete presenceMap[activeUser]; localStorage.removeItem("amada_active_user"); activeUser = ""; location.reload(); }
    function changeMyPassword(e) { e.preventDefault(); const pwd = document.getElementById("newPasswordInput").value.trim(); if(pwd && activeUser) { const u = users.find(x => x.name === activeUser); if(u) { u.password = pwd; saveData(); alert("Password updated successfully."); document.getElementById("newPasswordInput").value = ""; } } }

    // --- DRAG AND DROP ---
    let draggedTaskId = null, draggedNoteId = null, draggedSectionId = null;
    function makeDraggable(id) { const el = document.getElementById(id); if(el) el.setAttribute('draggable', 'true'); }
    function makeUndraggable(id) { const el = document.getElementById(id); if(el) el.setAttribute('draggable', 'false'); }
    function dragTask(e, id) { draggedTaskId = id; e.dataTransfer.setData('text/plain', id); e.target.style.opacity = '0.5'; }
    function endDragTask(e, id) { draggedTaskId = null; e.target.style.opacity = '1'; makeUndraggable('task_' + id); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
    function dragNote(e, id) { draggedNoteId = id; e.dataTransfer.setData('text/plain', id); e.target.style.opacity = '0.5'; }
    function endDragNote(e, id) { draggedNoteId = null; e.target.style.opacity = '1'; makeUndraggable('note_' + id); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
    function dragSection(e, id) { if(e.target.id !== 'section_'+id) return; draggedSectionId = id; e.dataTransfer.setData('text/plain', id); e.target.classList.add('opacity-50'); }
    function endDragSection(e, id) { draggedSectionId = null; e.target.classList.remove('opacity-50'); makeUndraggable('section_' + id); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
    function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function dropTaskIntoSection(e, sectionId) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); e.stopPropagation(); if (draggedTaskId) { const t = tasks.find(x => x.id === draggedTaskId); if (t && t.sectionId !== sectionId) { t.sectionId = sectionId; saveData(`Moved task`); } } }
    function dropNoteIntoFolder(e, folderId) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); if (draggedNoteId) { const n = notes.find(x => x.id === draggedNoteId); if (n && n.folderId !== folderId) { n.folderId = folderId; saveData(`Moved note`); } } }
    function dropSection(e, targetSectionId) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); if (draggedSectionId && draggedSectionId !== targetSectionId && !draggedTaskId) { let ordered = getPersonalOrderedSections(); const fromIdx = ordered.findIndex(s => s.id === draggedSectionId); const toIdx = ordered.findIndex(s => s.id === targetSectionId); const [moved] = ordered.splice(fromIdx, 1); ordered.splice(toIdx, 0, moved); savePersonalSectionOrder(ordered.map(s => s.id)); } }

    // --- UNIVERSAL FILE ---
    function handleUniversalPaste(e, type) { const items = (e.clipboardData || e.originalEvent.clipboardData).items; for (let i=0; i<items.length; i++) { if (items[i].kind === 'file') { processUniversalFile(items[i].getAsFile(), type); break; } } }
    function handleUniversalFileSelect(e, type) { if (e.target.files && e.target.files[0]) processUniversalFile(e.target.files[0], type); }
    function processUniversalFile(file, type) { if (!file) return; const reader = new FileReader(); reader.onload = (evt) => { tempFileState[type] = { name: file.name || "Pasted_File", data: evt.target.result, mime: file.type, annotatedData: null }; document.getElementById(`${type}FileNameLabel`).innerText = tempFileState[type].name; document.getElementById(`${type}FilePreviewContainer`).classList.remove("hidden"); }; reader.readAsDataURL(file); }
    function removeUniversalFile(type) { tempFileState[type] = null; const input = document.getElementById(`${type}FileInput`); if(input) input.value = ""; document.getElementById(`${type}FilePreviewContainer`).classList.add("hidden"); }
    function getAttachmentBadgeHTML(itemType, item) {
      if (!item.attachment || !item.attachment.data) return '';
      const isPdf = item.attachment.mime && item.attachment.mime.includes("pdf"); const icon = isPdf ? 'file-text' : 'image'; const color = isPdf ? 'text-red-400' : 'text-blue-400';
      return `<button onclick="event.stopPropagation(); openAnnotationModal('${itemType}', '${item.id}')" class="mt-2 w-full bg-white dark:bg-[#1E1E1E] border border-gray-200 dark:border-gray-700 rounded-lg p-2 flex items-center justify-between hover:border-[#A6192E] transition group"><div class="flex items-center space-x-2 truncate"><i data-lucide="${icon}" class="w-4 h-4 ${color}"></i><span class="text-[10px] font-semibold text-gray-600 dark:text-gray-300 truncate">${item.attachment.name}</span></div><span class="text-[9px] font-bold text-[#A6192E] opacity-0 group-hover:opacity-100 transition">View / Annotate</span></button>`;
    }

    // --- ANNOTATION ENGINE ---
    let annotCtx = null, annotCanvas = null, annotOrigImg = new Image(), annotHistory = [], annotStep = -1, annotMode = 'view', annotTool = 'pan', isDrawing = false, isPanning = false, lastX = 0, lastY = 0, lastPanX = 0, lastPanY = 0, currentAnnotItemType = null, currentAnnotItemId = null, showingAnnotated = true, textStyle = { bold: false, italic: false }, annotScale = 1, annotPanOffsetX = 0, annotPanOffsetY = 0;
    function setupCanvasEvents() {
      annotCanvas = document.getElementById("annotationCanvas"); annotCtx = annotCanvas.getContext("2d"); const wrapper = document.getElementById("canvasScrollWrapper");
      annotCanvas.addEventListener("pointerdown", startDraw); annotCanvas.addEventListener("pointermove", draw); window.addEventListener("pointerup", stopDraw); 
      wrapper.addEventListener("wheel", (e) => {
        if(!currentAnnotItemId) return; e.preventDefault(); const zoomIntensity = 0.1; const wheel = e.deltaY < 0 ? 1 : -1; const zoomFactor = Math.exp(wheel * zoomIntensity);
        const rect = annotCanvas.getBoundingClientRect(); const mouseX = (e.clientX - rect.left) / annotScale; const mouseY = (e.clientY - rect.top) / annotScale;
        const newScale = Math.min(Math.max(0.1, annotScale * zoomFactor), 10); annotPanOffsetX -= mouseX * (newScale - annotScale); annotPanOffsetY -= mouseY * (newScale - annotScale); annotScale = newScale; updateCanvasTransform();
      }, {passive: false});
    }
    function updateCanvasTransform() { annotCanvas.style.transform = `translate(${annotPanOffsetX}px, ${annotPanOffsetY}px) scale(${annotScale})`; }
    function annotFitToScreen() {
      if(!annotOrigImg || !annotOrigImg.width) return; const wrapper = document.getElementById("canvasScrollWrapper"); const wW = wrapper.clientWidth; const wH = wrapper.clientHeight; const iW = annotCanvas.width; const iH = annotCanvas.height;
      if(iW === 0 || iH === 0) return; const scale = Math.min(wW / iW, wH / iH) * 0.95; annotScale = scale; annotPanOffsetX = (wW - (iW * scale)) / 2; annotPanOffsetY = (wH - (iH * scale)) / 2; updateCanvasTransform();
    }
    function setAnnotMode(mode) {
      annotMode = mode; const btnV = document.getElementById("btnModeView"), btnA = document.getElementById("btnModeAnnotate"), tools = document.getElementById("annotationTools");
      if(mode === 'view') { btnV.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-[#A6192E] text-white shadow transition"; btnA.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition"; tools.classList.add("hidden"); tools.classList.remove("flex"); setDrawTool('pan'); } 
      else { btnA.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-[#A6192E] text-white shadow transition"; btnV.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition"; tools.classList.remove("hidden"); tools.classList.add("flex"); if(!showingAnnotated) toggleAnnotView('annot'); setDrawTool('pen'); }
    }
    function setDrawTool(tool) {
      annotTool = tool; document.querySelectorAll(".tool-btn").forEach(btn => btn.classList.remove("tool-active")); const btn = document.getElementById(`tool${tool.charAt(0).toUpperCase() + tool.slice(1)}`); if(btn) btn.classList.add("tool-active");
      const txtControls = document.getElementById("textStyleControls"); if(tool === 'text') txtControls.classList.remove("hidden"); else txtControls.classList.add("hidden");
      annotCanvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    }
    function toggleTextStyle(style) {
      textStyle[style] = !textStyle[style]; const btn = document.getElementById(style === 'bold' ? 'btnTextBold' : 'btnTextItalic');
      if(textStyle[style]) btn.classList.add("bg-gray-700", "text-white"); else btn.classList.remove("bg-gray-700", "text-white");
    }
    function getCanvasCoords(e) { const rect = annotCanvas.getBoundingClientRect(); return { x: (e.clientX - rect.left) / annotScale, y: (e.clientY - rect.top) / annotScale }; }
    function startDraw(e) {
      if (annotTool === 'pan' || annotMode === 'view') { isPanning = true; lastPanX = e.clientX; lastPanY = e.clientY; annotCanvas.style.cursor = 'grabbing'; return; }
      if (!showingAnnotated) return; isDrawing = true; const coords = getCanvasCoords(e); lastX = coords.x; lastY = coords.y;
      if (annotTool === 'text') {
        isDrawing = false; const txt = prompt("Enter text to place here:");
        if (txt) { const color = document.getElementById("annotColor").value; const size = document.getElementById("annotSize").value * 3 + 10; annotCtx.fillStyle = color; let fontStr = `${size}px Arial`; if (textStyle.bold) fontStr = "bold " + fontStr; if (textStyle.italic) fontStr = "italic " + fontStr; annotCtx.font = fontStr; annotCtx.fillText(txt, lastX, lastY); saveAnnotState(); }
      }
    }
    function draw(e) {
      if (isPanning) { e.preventDefault(); annotPanOffsetX += e.clientX - lastPanX; annotPanOffsetY += e.clientY - lastPanY; lastPanX = e.clientX; lastPanY = e.clientY; updateCanvasTransform(); return; }
      if (!isDrawing || annotTool === 'text' || !showingAnnotated) return; e.preventDefault(); const coords = getCanvasCoords(e); const color = document.getElementById("annotColor").value; const size = document.getElementById("annotSize").value;
      annotCtx.strokeStyle = color; annotCtx.lineWidth = size; annotCtx.lineCap = "round"; annotCtx.lineJoin = "round";
      if (annotTool === 'pen') { annotCtx.beginPath(); annotCtx.moveTo(lastX, lastY); annotCtx.lineTo(coords.x, coords.y); annotCtx.stroke(); lastX = coords.x; lastY = coords.y; }
    }
    function stopDraw(e) {
      if (isPanning) { isPanning = false; annotCanvas.style.cursor = annotMode === 'view' ? 'grab' : (annotTool === 'pan' ? 'grab' : 'crosshair'); return; }
      if (!isDrawing || !showingAnnotated) return; isDrawing = false;
      if (annotTool === 'arrow') { const coords = getCanvasCoords(e); drawArrow(annotCtx, lastX, lastY, coords.x, coords.y, document.getElementById("annotColor").value, document.getElementById("annotSize").value); }
      if (annotTool === 'pen' || annotTool === 'arrow') saveAnnotState();
    }
    function drawArrow(ctx, fromx, fromy, tox, toy, color, size) {
      const headlen = size * 3 + 5; const angle = Math.atan2(toy - fromy, tox - fromx);
      ctx.strokeStyle = color; ctx.lineWidth = size; ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy); ctx.stroke();

      annotHistory = []; annotStep = -1; showingAnnotated = true; toggleAnnotView('annot', true); setAnnotMode('view');
      annotScale = 1; annotPanOffsetX = 0; annotPanOffsetY = 0; updateCanvasTransform();

      if (att.mime && (att.mime.includes("doc") || att.mime.includes("docx"))) { document.getElementById("pdfLoadingIndicator").classList.add("hidden"); document.getElementById("unsupportedPreview").classList.remove("hidden"); return; }

      let sourceData = att.data;

        try {
          const pdfjsLib = window['pdfjs-dist/build/pdf']; pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
          const base64Marker = ';base64,'; const base64Index = sourceData.indexOf(base64Marker) + base64Marker.length;
          const raw = window.atob(sourceData.substring(base64Index)); const uint8Array = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) uint8Array[i] = raw.charCodeAt(i);
          const pdf = await pdfjsLib.getDocument(uint8Array).promise; const page = await pdf.getPage(1); const viewport = page.getViewport({ scale: 1.5 }); 
          const tempCanvas = document.createElement("canvas"); tempCanvas.width = viewport.width; tempCanvas.height = viewport.height;

        } catch(e) { document.getElementById("pdfLoadingIndicator").classList.add("hidden"); document.getElementById("unsupportedPreview").classList.remove("hidden"); return; }

            <button onclick="toggleOrderItemsAccordion('${ord.id}')" class="w-full flex items-center justify-between p-3 hover:bg-gray-100 dark:hover:bg-[#1B1B1B]"><span class="text-xs font-bold flex items-center space-x-1.5"><i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 ${isAccordionOpen ? 'rotate-180' : ''}"></i><span>Order Items (${hasItems ? ord.items.length : 0})</span></span><div class="flex items-center space-x-2 text-[10px]"><span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-semibold border border-emerald-500/20">Arrived: ${receivedCount}/${hasItems ? ord.items.length : 0}</span><span class="bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full font-semibold border border-amber-500/20">Stocked: ${stockedCount}/${hasItems ? ord.items.length : 0}</span></div></button>
            <div class="${isAccordionOpen ? '' : 'hidden'} p-3 pt-0 border-t border-gray-200 dark:border-gray-800 space-y-2 mt-2">
              ${hasItems ? ord.items.map(item => `<div class="flex flex-col sm:flex-row sm:items-center justify-between p-2 rounded-xl bg-white dark:bg-[#1E1E1E] border border-gray-200 dark:border-gray-800 gap-2"><span class="text-xs font-medium w-full sm:w-1/3 truncate" title="${item.desc}">${item.desc}</span><div class="flex items-center justify-center space-x-2 w-full sm:w-1/3"><label class="flex items-center space-x-1.5 cursor-pointer"><input type="checkbox" ${item.receivedPartial ? 'checked' : ''} onchange="toggleItemCheck('${ord.id}', '${item.id}', 'receivedPartial', this.checked)" class="w-3.5 h-3.5 rounded accent-amber-500"><span class="${item.receivedPartial ? 'text-amber-400 font-semibold' : 'text-gray-500'} text-[10px] uppercase tracking-wide">Partial</span></label><input type="text" placeholder="Qty (3/7)" value="${item.partialQty || ''}" onchange="updateItemPartialQty('${ord.id}', '${item.id}', this.value)" class="${item.receivedPartial ? 'opacity-100 w-20' : 'opacity-0 w-0 pointer-events-none'} transition-all duration-200 px-1.5 py-0.5 text-[10px] bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded focus:outline-none focus:border-amber-500 text-center"></div><div class="flex items-center justify-end space-x-3 w-full sm:w-1/3"><label class="flex items-center space-x-1.5 cursor-pointer"><input type="checkbox" ${item.received ? 'checked' : ''} onchange="toggleItemCheck('${ord.id}', '${item.id}', 'received', this.checked)" class="w-4 h-4 rounded accent-emerald-500"><span class="${item.received ? 'text-emerald-400 font-bold' : 'text-gray-400'} text-[11px]">Arrived</span></label><label class="flex items-center space-x-1.5 cursor-pointer"><input type="checkbox" ${item.stocked ? 'checked' : ''} onchange="toggleItemCheck('${ord.id}', '${item.id}', 'stocked', this.checked)" class="w-4 h-4 rounded accent-blue-500"><span class="${item.stocked ? 'text-blue-400 font-bold' : 'text-gray-400'} text-[11px]">Stocked</span></label></div></div>`).join('') : '<div class="text-xs text-gray-500 italic py-1">No items listed.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function toggleOrderStage(orderId, stage, checked) {
      const ord = orders.find(x => x.id === orderId); if (!ord) return;
      const meta = `${checked ? 'Confirmed' : 'Unchecked'} by ${activeUser || 'User'} on ${new Date().toLocaleString()}`;
      if (stage === 'received') { ord.received = checked; if (ord.items) ord.items.forEach(i => { i.received = checked; if (checked) i.receivedPartial = false; }); } 
      else if (stage === 'placed') { ord.placed = checked; } else if (stage === 'vbop') { ord.vbop = checked; ord.vbopMeta = checked ? meta : null; } 
      else if (stage === 'emailed') { ord.emailed = checked; ord.emailedMeta = checked ? meta : null; } else if (stage === 'stocked') { ord.stocked = checked; ord.stockedMeta = checked ? meta : null; if (ord.items) ord.items.forEach(i => i.stocked = checked); } 
      else { ord[stage] = checked; } saveData(`Updated PO# ${ord.poNumber} status`);
    }

    function toggleItemCheck(orderId, itemId, field, checked) {
      const ord = orders.find(x => x.id === orderId); if (!ord || !ord.items) return; const it = ord.items.find(x => x.id === itemId);
      if (it) { it[field] = checked; if (field === 'received' && checked) it.receivedPartial = false; if (field === 'receivedPartial' && checked) it.received = false; if (field === 'receivedPartial' && !checked) it.partialQty = ""; ord.received = ord.items.every(i => i.received); saveData(`Updated items on PO# ${ord.poNumber}`); }
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      document.getElementById("tasksWrapper").classList.toggle("hidden", tab !== 'tasks'); document.getElementById("notesView").classList.toggle("hidden", tab !== 'notes'); document.getElementById("ordersView").classList.toggle("hidden", tab !== 'orders');
      document.getElementById("taskSectionsSidebarBlock").classList.toggle("hidden", tab !== 'tasks'); document.getElementById("noteFoldersSidebarBlock").classList.toggle("hidden", tab !== 'notes');
      
      const dActive = "nav-btn px-4 py-2 rounded-xl text-xs font-bold bg-[#A6192E] text-white shadow flex items-center space-x-2 transition-all";
      const dInactive = "nav-btn px-4 py-2 rounded-xl text-xs font-semibold text-gray-600 dark:text-gray-400 hover:text-white flex items-center space-x-2 transition-all";
      const btnT = document.getElementById("tabTasksDesktop"); const btnN = document.getElementById("tabNotesDesktop"); const btnO = document.getElementById("tabOrdersDesktop");
      if(btnT) btnT.className = tab === 'tasks' ? dActive : dInactive; if(btnN) btnN.className = tab === 'notes' ? dActive : dInactive; if(btnO) btnO.className = tab === 'orders' ? dActive : dInactive;

      const mActive = "nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-[#A6192E]";
      const mInactive = "nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-gray-400";
      const mbT = document.getElementById("mobileNavTasks"); const mbN = document.getElementById("mobileNavNotes"); const mbO = document.getElementById("mobileNavOrders");
      if(mbT) mbT.className = tab === 'tasks' ? mActive : mInactive; if(mbN) mbN.className = tab === 'notes' ? mActive : mInactive; if(mbO) mbO.className = tab === 'orders' ? mActive : mInactive;
      renderAll();
    }
    function toggleDarkMode() { document.documentElement.classList.toggle("dark"); }
    function openSettingsModal() { document.getElementById("settingsModal").classList.remove("hidden"); updatePushUI(); }
    function closeSettingsModal() { document.getElementById("settingsModal").classList.add("hidden"); }
  </script>
</body>
</html>
