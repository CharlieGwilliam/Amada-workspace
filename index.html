<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amada Workspace</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amada: { red: '#A6192E', dark: '#121212', card: '#1E1E1E' }
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth Fluid Green Strikethrough Animation */
    .strikethrough-anim {
      position: relative;
      display: inline-block;
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .strikethrough-anim::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      background-color: #22c55e;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .strikethrough-active { color: #71717a !important; }
    .strikethrough-active::after { transform: scaleX(1); }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-white text-gray-900 dark:bg-[#121212] dark:text-gray-100 transition-colors duration-200">

  <!-- USER LOGIN & PASSWORD OVERLAY -->
  <div id="authOverlay" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1E1E1E] border border-gray-200 dark:border-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
      <div class="w-14 h-14 bg-[#A6192E] rounded-xl flex items-center justify-center mx-auto mb-4 font-bold text-2xl text-white shadow-lg">A</div>
      <h2 class="text-2xl font-bold mb-1">Amada Workspace</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">Who is using the workspace today?</p>
      
      <div id="userSelectionStep" class="space-y-3">
        <div id="userProfilesList" class="grid grid-cols-2 gap-3 mb-4"></div>
        <button onclick="openAddViewerModal()" class="w-full border border-dashed border-gray-400 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-xs py-2.5 rounded-xl font-medium flex items-center justify-center space-x-2 transition">
          <i data-lucide="user-plus" class="w-4 h-4 text-[#A6192E]"></i>
          <span>Add Viewer Profile</span>
        </button>
      </div>

      <!-- Password Section -->
      <form id="passwordStep" onsubmit="verifyPassword(event)" class="hidden space-y-4">
        <div class="text-left">
          <button type="button" onclick="resetLoginStep()" class="text-xs text-gray-400 hover:text-white mb-2 flex items-center space-x-1">
            <i data-lucide="arrow-left" class="w-3 h-3"></i> <span>Back</span>
          </button>
          <label id="loginUserLabel" class="block text-xs font-semibold text-gray-400 uppercase mb-1">Enter Password</label>
          <input type="password" id="loginPassword" required placeholder="Password" class="w-full bg-gray-100 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#A6192E]">
        </div>
        <div id="authError" class="text-red-500 text-xs text-left hidden">Incorrect password. Access denied.</div>
        <button type="submit" class="w-full bg-[#A6192E] text-white py-2.5 rounded-lg font-semibold hover:opacity-90 transition">Login</button>
      </form>
    </div>
  </div>

  <!-- TOP BAR -->
  <header class="h-14 bg-gray-100 dark:bg-[#181818] border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 bg-[#A6192E] rounded flex items-center justify-center font-bold text-white text-sm">A</div>
        <span class="font-bold text-lg tracking-wide">AMADA</span>
      </div>

      <!-- PERSONAL VS SHARED MAIN TOGGLE -->
      <div class="flex bg-gray-2
